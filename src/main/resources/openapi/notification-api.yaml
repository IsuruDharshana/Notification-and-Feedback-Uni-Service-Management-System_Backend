openapi: 3.0.3
info:
  title: Group 8 Notification API
  version: 1.0.0
  description: |
    Cross-team contract for the communication-feedback-service notification
    foundation. Group 6, Group 7, and Group 8 workflows may call the trigger
    endpoint after their own state change has committed successfully.
servers:
  - url: /
paths:
  /api/notifications:
    get:
      summary: List notifications for the authenticated user
      operationId: listMyNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of notifications ordered newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{id}/read:
    patch:
      summary: Mark one notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Updated notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user does not own the notification.
        '404':
          description: Notification was not found.

  /api/notifications/trigger:
    post:
      summary: Create a notification from a trusted service workflow
      operationId: triggerNotification
      security:
        - serviceKey: []
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Shared secret for trusted service-to-service calls.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTriggerRequest'
            examples:
              reservationApproved:
                value:
                  recipientId: 00000000-0000-0000-0000-000000000001
                  message: Reservation approved for Lab B-204.
                  relatedType: RESERVATION
                  relatedId: 00000000-0000-0000-0000-000000000002
      responses:
        '201':
          description: Notification created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Request validation failed.
        '403':
          description: Missing or invalid service key.
        '404':
          description: Recipient does not exist in the Group 5 directory.
        '503':
          description: Group 5 recipient directory is not configured or unavailable.

  /api/announcements:
    get:
      summary: List published announcements visible to the supplied audience context
      operationId: listVisibleAnnouncements
      security:
        - bearerAuth: []
      parameters:
        - name: audienceType
          in: query
          schema:
            $ref: '#/components/schemas/AudienceType'
        - name: audienceValue
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Published announcements matching ALL and the supplied audience.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create an announcement draft
      operationId: createAnnouncement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreateRequest'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '400':
          description: Invalid announcement or targeting rule.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/announcements/{id}/publish:
    post:
      summary: Publish an announcement draft
      operationId: publishAnnouncement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: Announcement published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user did not create the announcement.
        '404':
          description: Announcement was not found.
        '409':
          description: Announcement is not a draft.

  /api/announcements/{id}/archive:
    post:
      summary: Archive a published announcement
      operationId: archiveAnnouncement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: Announcement archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user did not create the announcement.
        '404':
          description: Announcement was not found.
        '409':
          description: Announcement is not published.

  /api/feedback/forms:
    get:
      summary: List active feedback forms
      operationId: listFeedbackForms
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active forms ordered newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackForm'
    post:
      summary: Create a feedback form for an event or service request
      operationId: createFeedbackForm
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackFormCreateRequest'
      responses:
        '201':
          description: Feedback form created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackForm'
        '400':
          description: Invalid feedback form.
        '409':
          description: A form already exists for the activity.

  /api/feedback/forms/{formId}:
    get:
      summary: Get one feedback form
      operationId: getFeedbackForm
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedbackFormId'
      responses:
        '200':
          description: Feedback form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackForm'
        '404':
          description: Feedback form was not found.

  /api/feedback/forms/{formId}/responses:
    get:
      summary: List responses for a feedback form
      operationId: listFeedbackResponses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedbackFormId'
      responses:
        '200':
          description: Feedback responses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackResponse'
        '404':
          description: Feedback form was not found.
    post:
      summary: Submit one response to a feedback form
      operationId: submitFeedbackResponse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedbackFormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackResponseRequest'
      responses:
        '201':
          description: Feedback response created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          description: Rating or response data is invalid.
        '403':
          description: The user is not eligible to submit feedback.
        '404':
          description: Feedback form was not found.
        '409':
          description: Form is inactive or the user already submitted a response.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key

  parameters:
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AnnouncementId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FeedbackFormId:
      name: formId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid JWT.

  schemas:
    NotificationTriggerRequest:
      type: object
      required:
        - recipientId
        - message
        - relatedType
      properties:
        recipientId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
        relatedType:
          $ref: '#/components/schemas/RelatedType'
        relatedId:
          type: string
          format: uuid
          nullable: true

    Notification:
      type: object
      required:
        - id
        - recipientId
        - message
        - relatedType
        - isRead
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        message:
          type: string
        relatedType:
          $ref: '#/components/schemas/RelatedType'
        relatedId:
          type: string
          format: uuid
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required:
        - content
        - number
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    RelatedType:
      type: string
      enum:
        - EVENT
        - REGISTRATION
        - ANNOUNCEMENT
        - RESERVATION
        - SERVICE_REQUEST
        - EXTERNAL

    AudienceType:
      type: string
      enum:
        - ALL
        - ROLE
        - DEPARTMENT
        - FACULTY
        - SERVICE_UNIT

    AnnouncementCreateRequest:
      type: object
      required:
        - title
        - content
        - audienceType
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        audienceType:
          $ref: '#/components/schemas/AudienceType'
        ruleValue:
          type: string
          maxLength: 100

    Announcement:
      type: object
      required:
        - id
        - title
        - content
        - status
        - createdBy
        - audienceType
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        createdBy:
          type: string
          format: uuid
        audienceType:
          $ref: '#/components/schemas/AudienceType'
        ruleValue:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeedbackFormCreateRequest:
      type: object
      required:
        - activityType
        - activityId
        - title
        - questionsJson
      properties:
        activityType:
          type: string
          enum: [EVENT, SERVICE_REQUEST]
        activityId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        questionsJson:
          type: string

    FeedbackForm:
      type: object
      required:
        - id
        - activityType
        - activityId
        - title
        - questionsJson
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        activityType:
          type: string
          enum: [EVENT, SERVICE_REQUEST]
        activityId:
          type: string
          format: uuid
        title:
          type: string
        questionsJson:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeedbackResponseRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000

    FeedbackResponse:
      type: object
      required:
        - id
        - formId
        - activityId
        - respondentId
        - rating
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        formId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        respondentId:
          type: string
          format: uuid
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
