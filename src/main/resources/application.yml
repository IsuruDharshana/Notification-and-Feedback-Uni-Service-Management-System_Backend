server:
  port: ${PORT:${SERVER_PORT:8082}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

notification:
  service-key: ${NOTIFICATIONS_SERVICE_KEY:${NOTIFICATION_SERVICE_KEY:}}

user-directory:
  base-url: ${USER_DIRECTORY_BASE_URL:}
  user-path: ${USER_DIRECTORY_USER_PATH:/api/users/{userId}}
  eligibility-path: ${USER_DIRECTORY_ELIGIBILITY_PATH:/api/v1/validation/users/{userId}/eligibility}
  required-role: ${USER_DIRECTORY_REQUIRED_ROLE:}

facility-directory:
  base-url: ${FACILITY_DIRECTORY_BASE_URL:}
  venue-path: ${FACILITY_DIRECTORY_VENUE_PATH:/api/facilities/{venueId}}

group7-feedback:
  base-url: ${GROUP7_FEEDBACK_BASE_URL:}
  eligibility-path: ${GROUP7_FEEDBACK_ELIGIBILITY_PATH:/api/feedback-eligibility/{activityType}/{activityId}?userId={userId}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
