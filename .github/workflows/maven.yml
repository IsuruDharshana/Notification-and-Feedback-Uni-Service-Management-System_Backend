name: Maven and Docker Health Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn -B -s .mvn-settings.xml test

      - name: Build Docker image
        run: docker build -t communication-feedback-service:ci .

      - name: Create Docker network
        run: docker network create group8-ci-network

      - name: Start MySQL container
        run: |
          docker run -d \
            --name communication-feedback-mysql \
            --network group8-ci-network \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=communication_feedback_db \
            -e MYSQL_USER=group8 \
            -e MYSQL_PASSWORD=group8 \
            --health-cmd="mysqladmin ping -h localhost -uroot -proot" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=12 \
            mysql:8.4

      - name: Wait for MySQL to become healthy
        run: |
          for i in {1..24}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              communication-feedback-mysql)

            echo "MySQL health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "MySQL did not become healthy in time."
          docker logs communication-feedback-mysql
          exit 1

      - name: Start communication-feedback service
        run: |
          docker run -d \
            --name communication-feedback-service \
            --network group8-ci-network \
            -p 8082:8082 \
            -e DB_URL=jdbc:mysql://communication-feedback-mysql:3306/communication_feedback_db \
            -e DB_USERNAME=group8 \
            -e DB_PASSWORD=group8 \
            -e SERVER_PORT=8082 \
            -e JWT_SECRET=ci-only-secret-key-for-github-actions-123456789 \
            communication-feedback-service:ci

      - name: Wait for application health check
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              communication-feedback-service)

            echo "Application health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Communication Feedback Service is healthy."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Communication Feedback Service became unhealthy."
              docker logs communication-feedback-service
              exit 1
            fi

            sleep 5
          done

          echo "Application did not become healthy in time."
          docker logs communication-feedback-service
          exit 1

      - name: Verify health endpoint
        run: curl --fail http://localhost:8082/actuator/health

      - name: Show Docker status
        run: docker ps

      - name: Show logs if workflow fails
        if: failure()
        run: |
          echo "===== APPLICATION LOGS ====="
          docker logs communication-feedback-service || true

          echo "===== MYSQL LOGS ====="
          docker logs communication-feedback-mysql || true

      - name: Clean up Docker containers
        if: always()
        run: |
          docker rm -f communication-feedback-service || true
          docker rm -f communication-feedback-mysql || true
          docker network rm group8-ci-network || true
